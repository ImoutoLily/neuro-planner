<div class="row actions">
  <button mat-button (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Create
  </button>
  <button mat-button [disabled]="hasOnlyCompleteItemsSelected()" (click)="openCompleteDialog()">
    <mat-icon>check</mat-icon>
    Complete
  </button>
  <button mat-button [disabled]="hasNoItemsSelected()" (click)="openDeleteDialog()">
    <mat-icon>delete</mat-icon>
    Delete
  </button>
</div>
