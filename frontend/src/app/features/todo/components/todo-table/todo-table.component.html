<table mat-table [dataSource]="dataSource" matSort matSortActive="dueDate" matSortDisableClear matSortDirection="asc">
  <ng-container matColumnDef="selected">
    <th mat-header-cell *matHeaderCellDef>
      <mat-checkbox
        (change)="$event ? toggleAllSelect() : null"
        [checked]="selection.hasValue() && isAllSelected()"
        [indeterminate]="selection.hasValue() && !isAllSelected()"
        [aria-label]="selectAriaLabel()">
      </mat-checkbox>
    </th>
    <td mat-cell *matCellDef="let item">
      <mat-checkbox
        (click)="$event.stopPropagation()"
        (change)="$event ? selection.toggle(item) : null"
        [checked]="selection.isSelected(item)"
        [aria-label]="selectAriaLabel(item)">
      </mat-checkbox>
    </td>
  </ng-container>
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
    <td mat-cell *matCellDef="let item">{{ item.description }}</td>
  </ng-container>
  <ng-container matColumnDef="completed">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
    <td mat-cell *matCellDef="let item">
      <mat-chip-set aria-label="Todo status">
        @if (item.completed) {
          <mat-chip highlighted>
            <mat-icon matChipAvatar>check</mat-icon>
            Complete
          </mat-chip>
        } @else {
          <mat-chip>Incomplete</mat-chip>
        }
      </mat-chip-set>
    </td>
  </ng-container>
  <ng-container matColumnDef="dueDate">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Due</th>
    <td mat-cell *matCellDef="let item">{{ item.dueDate | date }}</td>
  </ng-container>
  <ng-container matColumnDef="createdDate">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
    <td mat-cell *matCellDef="let item">{{ item.createdDate | date }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let item">
      <button mat-icon-button [matMenuTriggerFor]="actionsMenu" [attr.aria-label]="'Action menu for ' + item.text">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #actionsMenu="matMenu">
        <button mat-menu-item>
          <mat-icon>check</mat-icon>
          {{ item.completed ? "Undo completion" : "Complete" }}
        </button>
        <button mat-menu-item>
          <mat-icon>edit</mat-icon>
          Edit
        </button>
        <button mat-menu-item (click)="openDeleteDialog(item)">
          <mat-icon>delete</mat-icon>
          Delete
        </button>
      </mat-menu>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayColumns;"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumns;"></tr>
</table>
<mat-paginator [pageSizeOptions]="[5, 10, 25]" [pageSize]="10" showFirstLastButtons aria-label="Show page of todo list">
</mat-paginator>
