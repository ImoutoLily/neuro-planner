<div class="flex">
  <div class="row">
    <div class="buttons">
      <button mat-icon-button aria-label="Open folder button">
        <mat-icon>folder</mat-icon>
      </button>
      <button mat-icon-button aria-label="Create note button">
        <mat-icon>note_add</mat-icon>
      </button>
      <button mat-icon-button aria-label="Search notes button">
        <mat-icon>search</mat-icon>
      </button>
    </div>
    <span class="spacer"></span>
    <div class="buttons">
      <mat-button-toggle-group [formControl]="viewMode" aria-label="View mode">
        <mat-button-toggle [value]="ViewMode.Editor">
          <mat-icon>edit</mat-icon>
        </mat-button-toggle>
        <mat-button-toggle [value]="ViewMode.Render">
          <mat-icon>article</mat-icon>
        </mat-button-toggle>
        <mat-button-toggle [value]="ViewMode.SplitView">
          <mat-icon>compare</mat-icon>
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>
  </div>
  <div class="row notes">
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="tree">
      <mat-tree-node *matTreeNodeDef="let node">
        <button mat-button>{{ node.fileName }}</button>
      </mat-tree-node>
      <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChildren" matTreeNodeToggle>
        <div class="mat-tree-node">
          <button mat-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.fileName">
            <mat-icon class="mat-icon-rtl-mirror">
              {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
            </mat-icon>
            {{ node.fileName }}
          </button>
        </div>
        <div [class.tree-invisible]="!treeControl.isExpanded(node)" role="group" (click)="$event.stopPropagation();">
          <ng-container matTreeNodeOutlet></ng-container>
        </div>
      </mat-nested-tree-node>
    </mat-tree>
    <div class="row note-view" [ngClass]="viewMode.value == ViewMode.SplitView ? 'split-view' : ''">
      @if (viewMode.value == ViewMode.Editor || viewMode.value == ViewMode.SplitView) {
        <mat-card appearance="outlined" class="editor-container">
          <textarea class="editor" [formControl]="noteCode" (keydown)="handleEditorKeydown($event)"></textarea>
        </mat-card>
      }
      @if (viewMode.value == ViewMode.Render || viewMode.value == ViewMode.SplitView) {
        <mat-card appearance="outlined" class="render-container">
          <markdown class="render" lineNumbers emoji clipboard [data]="noteCode.value" ngPreserveWhitespaces>
          </markdown>
        </mat-card>
      }
    </div>
  </div>
</div>
