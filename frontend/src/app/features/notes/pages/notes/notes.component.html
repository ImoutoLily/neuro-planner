<mat-tree #tree [dataSource]="dataSource" [treeControl]="treeControl" class="tree">
  <mat-tree-node *matTreeNodeDef="let node">
    <button mat-button>{{ node.fileName }}</button>
  </mat-tree-node>
  <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChildren" matTreeNodeToggle>
    <div class="mat-tree-node">
      <button mat-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.fileName">
        <mat-icon class="mat-icon-rtl-mirror">
          {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
        </mat-icon>
        {{ node.fileName }} DEF
      </button>
    </div>
    <div [class.tree-invisible]="!treeControl.isExpanded(node)" role="group" (click)="$event.stopPropagation();">
      <ng-container matTreeNodeOutlet></ng-container>
    </div>
  </mat-nested-tree-node>
</mat-tree>
